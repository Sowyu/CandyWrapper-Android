name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The release notes list the commits since the previous nightly tag.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew :core:test --console=plain

      # Every nightly must carry the same key, or the in-app updater hits a signature conflict.
      # A missing secret fails the run instead of falling back to a debug key.
      - name: Release signing key
        env:
          CW_KEYSTORE_BASE64: ${{ secrets.CW_KEYSTORE_BASE64 }}
          CW_KEYSTORE_PASSWORD: ${{ secrets.CW_KEYSTORE_PASSWORD }}
          CW_KEY_ALIAS: ${{ secrets.CW_KEY_ALIAS }}
          CW_KEY_PASSWORD: ${{ secrets.CW_KEY_PASSWORD }}
        run: |
          for name in CW_KEYSTORE_BASE64 CW_KEYSTORE_PASSWORD CW_KEY_ALIAS CW_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::The $name secret is missing; see README.md, Release signing."; exit 1; fi
          done
          printf '%s' "$CW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CW_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          CW_KEYSTORE_PASSWORD: ${{ secrets.CW_KEYSTORE_PASSWORD }}
          CW_KEY_ALIAS: ${{ secrets.CW_KEY_ALIAS }}
          CW_KEY_PASSWORD: ${{ secrets.CW_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --console=plain
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          signer=$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "CW_SIGNER=$signer" >> "$GITHUB_ENV"

      # The app reads update.json and then downloads the APK it names. The APK goes up under a
      # per-run name first, so the manifest never points at a file that is missing or newer.
      # Each asset is uploaded under a temporary name and renamed over the old one, so neither
      # update.json nor the stable APK name is ever missing for more than a moment.
      - name: Publish the nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          short="${GITHUB_SHA::7}"
          versioned="CandyWrapper-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$versioned"
          sha=$(sha256sum "$versioned" | cut -d' ' -f1)

          if git rev-parse -q --verify refs/tags/nightly >/dev/null && git merge-base --is-ancestor refs/tags/nightly HEAD; then
            range="refs/tags/nightly..HEAD"
          else
            range="HEAD"
          fi
          git log --format=%s -n 10 "$range" > notes.txt
          [ -s notes.txt ] || git log --format=%s -n 1 HEAD > notes.txt

          jq -n --argjson code "$GITHUB_RUN_NUMBER" --arg name "0.1.${GITHUB_RUN_NUMBER}-${short}" --arg commit "$GITHUB_SHA" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg apk "$versioned" --arg sha "$sha" --rawfile notes notes.txt \
            '{versionCode: $code, versionName: $name, commit: $commit, publishedAt: $at, apkName: $apk, sha256: $sha,
              notes: ($notes | split("\n") | map(select(length > 0)))}' > update.json
          cat update.json

          {
            echo "Build 0.1.${GITHUB_RUN_NUMBER}-${short}, signed with the release key (certificate SHA-256 \`${CW_SIGNER}\`)."
            echo
            echo "Builds before the release key were signed with a CI debug key. If one of those is installed, uninstall it once, then install this APK. Later builds update from inside the app."
            echo
            echo "Changes:"
            sed 's/^/- /' notes.txt
          } > release-notes.md

          if ! gh release view nightly --repo "$repo" >/dev/null 2>&1; then
            gh release create nightly --repo "$repo" --target "$GITHUB_SHA" --prerelease --title "Nightly" --notes "Publishing"
          fi

          swap() { # swap <local file> <asset name>
            staged="$2.$GITHUB_RUN_ID"
            cp "$1" "$staged"
            gh release upload nightly "$staged" --repo "$repo" --clobber
            assets=$(gh api "repos/$repo/releases/tags/nightly" --jq '.assets[] | "\(.id) \(.name)"')
            old_id=$(awk -v n="$2" '$2 == n { print $1 }' <<<"$assets")
            new_id=$(awk -v n="$staged" '$2 == n { print $1 }' <<<"$assets")
            if [ -n "$old_id" ]; then gh api -X DELETE "repos/$repo/releases/assets/$old_id"; fi
            gh api -X PATCH "repos/$repo/releases/assets/$new_id" -f name="$2" >/dev/null
          }

          gh release upload nightly "$versioned" --repo "$repo" --clobber
          swap update.json update.json
          swap "$versioned" CandyWrapper-nightly.apk

          # Keep this run's APK and the one before it, for a phone that read the previous update.json.
          gh api "repos/$repo/releases/tags/nightly" --jq '.assets[] | "\(.id) \(.name)"' |
            awk -v keep="$versioned" '$2 ~ /^CandyWrapper-[0-9]+\.apk$/ && $2 != keep { split($2, a, /[-.]/); print a[2], $1 }' |
            sort -n | head -n -1 | while read -r _ id; do gh api -X DELETE "repos/$repo/releases/assets/$id"; done

          gh api -X PATCH "repos/$repo/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null ||
            gh api -X POST "repos/$repo/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          gh release edit nightly --repo "$repo" --target "$GITHUB_SHA" --prerelease --title "Nightly ${short}" --notes-file release-notes.md
