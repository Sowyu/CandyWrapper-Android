name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Without a release key the APK is signed with the debug key. Keeping that key between runs
      # lets a nightly install over the previous one; if the cache is evicted the key changes.
      - name: Keep the debug signing key
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore

      - name: Test
        run: ./gradlew :core:test --console=plain

      - name: Release signing key
        env:
          CW_KEYSTORE_BASE64: ${{ secrets.CW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CW_KEYSTORE_BASE64" ]; then
            echo "$CW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CW_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "CW_SIGNED_WITH=the release key from repository secrets" >> "$GITHUB_ENV"
          else
            echo "CW_SIGNED_WITH=the CI debug key (no CW_KEYSTORE_BASE64 secret set)" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          CW_KEYSTORE_PASSWORD: ${{ secrets.CW_KEYSTORE_PASSWORD }}
          CW_KEY_ALIAS: ${{ secrets.CW_KEY_ALIAS }}
          CW_KEY_PASSWORD: ${{ secrets.CW_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Publish the nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk CandyWrapper-nightly.apk
          notes="Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Signed with ${CW_SIGNED_WITH}."
          git tag -f nightly
          git push -f origin refs/tags/nightly
          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly" --notes "$notes"
          else
            gh release create nightly --prerelease --title "Nightly" --notes "$notes"
          fi
          gh release upload nightly CandyWrapper-nightly.apk --clobber
